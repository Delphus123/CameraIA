# Frigate NVR — deploy no QNAP TS-453Be (Container Station)
# Uso: docker compose up -d
# Requisitos: pasta /share/Container/frigate criada no NAS; Container Station instalado.

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - /share/Container/frigate/mosquitto:/mosquitto/data

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    container_name: frigate
    restart: unless-stopped
    privileged: true # acesso à iGPU e shm
    shm_size: "256mb" # ajustar: ~3x resolução detecção (320px) por câmera — 16 câmeras cabem
    devices:
      - /dev/dri:/dev/dri # iGPU Intel HD 500 → OpenVINO GPU + VAAPI
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /share/Container/frigate/config.yml:/config/config.yml
      - /share/Container/frigate/media:/media/frigate # gravações/clipes no NAS
      - /share/Container/frigate/db:/db
    ports:
      - "8971:8971" # UI (autenticada)
      - "5000:5000" # UI interna sem auth (só rede local)
      - "8554:8554" # RTSP restream
      - "8555:8555/tcp" # WebRTC
      - "8555:8555/udp"
    environment:
      FRIGATE_RTSP_PASSWORD: "frigate123"
