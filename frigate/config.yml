# Frigate — BMax B4 Turbo (N150, iGPU 24EU) + DVR Hikvision DS-7216HQHI-K2 (16ch HDTVI)
# Piloto: 4 primeiras câmeras. Detector: OpenVINO na iGPU (device: GPU).
# Ao adicionar câmera: copiar bloco cam_XX e trocar o N de Channels/N01 e N02.

mqtt:
  enabled: true
  host: mqtt

auth:
  enabled: true
  reset_admin_password: false

model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr

detectors:
  ov:
    type: openvino
    # 18/10/26: detector movido CPU→GPU (iGPU 24EU do N150) p/ aliviar ~0,7-1,5 core da CPU.
    # Rollback: voltar para device: CPU.
    device: GPU

# decode: VAAPI na iGPU (ffmpeg -hwaccel vaapi); fallback p/ CPU se o erro -38 voltar

record:
  enabled: true
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 30
  continuous:
    days: 0
  motion:
    days: 14

# GenAI local: Ollama no container ollama-vlm (mesma rede frigate_default).
# Papel apenas 'descriptions' — sem chat/embeddings (N150 não aguenta embeddings locais).
genai:
  local-ollama:
    provider: ollama
    base_url: http://ollama-vlm:11434
    # qwen25vl-bmax = qwen2.5vl:3b + PARAMETER num_ctx 16384 (Modelfile no ollama-vlm).
    # Moondream descartado: contexto nativo 2048 não absorve as sequências de
    # thumbnails do Frigate (2233-7336 tokens medidos).
    model: qwen25vl-bmax
    roles: [descriptions]
objects:
  track:
    - person
    - car
    - motorcycle
  genai:
    # 04/11/26: GenAI nativo do Frigate DESLIGADO — o bridge ai-notify faz o papel
    # (alerta imediato + descrição via Ollama com snapshot único). Motivos medidos:
    # sequências de thumbnails = 2.2-7.3k tokens (moondream: ctx 2048 insuficiente;
    # qwen2.5vl:3b: 3-10 min no N150 > timeout 120s do cliente do Frigate).
    # Rollback: enabled: true + model no genai (bloco de provider documentado abaixo).
    enabled: false
    objects: [person, car, motorcycle]
    use_snapshot: false
    prompt: >-
      Describe this security camera snapshot concisely: what is visible, what the {label}
      is doing, and notable details (clothing, objects, vehicles). Plain English, max 2 sentences.

# Snapshots: exigidos pelo bridge ai-notify (descrição GenAI + foto no Telegram).
# bounding_boxes/timestamp off: texto queimado na imagem desvia o Moondream
# (ele "lê" o OSD e entra em loop de repetição — medido 04/11/26).
snapshots:
  enabled: true
  quality: 80
  bounding_box: false
  timestamp: false

cameras:
  cam_1:
    ffmpeg:
      output_args:
        record: preset-record-generic
      inputs:
        - path: 
            rtsp://frigate:{FRIGATE_RTSP_PASSWORD}@192.168.2.182:554/Streaming/Channels/102
          input_args:
            - -rtsp_transport
            - tcp
          roles: [detect, record]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
  cam_2:
    ffmpeg:
      output_args:
        record: preset-record-generic
      inputs:
        - path: 
            rtsp://frigate:{FRIGATE_RTSP_PASSWORD}@192.168.2.182:554/Streaming/Channels/202
          input_args:
            - -rtsp_transport
            - tcp
          roles: [detect, record]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
  cam_3:
    ffmpeg:
      output_args:
        record: preset-record-generic
      inputs:
        - path: 
            rtsp://frigate:{FRIGATE_RTSP_PASSWORD}@192.168.2.182:554/Streaming/Channels/302
          input_args:
            - -rtsp_transport
            - tcp
          roles: [detect, record]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
  cam_4:
    ffmpeg:
      output_args:
        record: preset-record-generic
      inputs:
        - path: 
            rtsp://frigate:{FRIGATE_RTSP_PASSWORD}@192.168.2.182:554/Streaming/Channels/402
          input_args:
            - -rtsp_transport
            - tcp
          roles: [detect, record]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
version: 0.18-0
lpr:
  enabled: true
  enhancement: 2
