# Frigate — BMax B4 Turbo (N150, iGPU 24EU) + DVR Hikvision DS-7216HQHI-K2 (16ch HDTVI)
# Piloto: 4 primeiras câmeras. Detector: OpenVINO na iGPU (device: GPU).
# Ao adicionar câmera: copiar bloco cam_XX e trocar o N de Channels/N01 e N02.

mqtt:
  enabled: true
  host: mqtt

auth:
  enabled: true
  reset_admin_password: false

model:
  path: /openvino-model/ssdlite_mobilenet_v2.xml
  labelmap_path: /openvino-model/coco_91cl_bkgr.txt
  width: 300
  height: 300
  input_tensor: nhwc
  input_pixel_format: bgr

detectors:
  ov:
    type: openvino
    # 18/10/26: detector movido CPU→GPU (iGPU 24EU do N150) p/ aliviar ~0,7-1,5 core da CPU.
    # Rollback: voltar para device: CPU.
    device: GPU

# decode: VAAPI na iGPU (ffmpeg -hwaccel vaapi); fallback p/ CPU se o erro -38 voltar

record:
  enabled: true
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 30
  continuous:
    days: 0
  motion:
    days: 14
objects:
  track:
    - person
    - car

cameras:
  cam_1:
    ffmpeg:
      output_args:
        record: preset-record-generic
      inputs:
        - path: 
            rtsp://frigate:{FRIGATE_RTSP_PASSWORD}@192.168.2.182:554/Streaming/Channels/102
          input_args:
            - -rtsp_transport
            - tcp
          roles: [detect, record]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
  cam_2:
    ffmpeg:
      output_args:
        record: preset-record-generic
      inputs:
        - path: 
            rtsp://frigate:{FRIGATE_RTSP_PASSWORD}@192.168.2.182:554/Streaming/Channels/202
          input_args:
            - -rtsp_transport
            - tcp
          roles: [detect, record]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
  cam_3:
    ffmpeg:
      output_args:
        record: preset-record-generic
      inputs:
        - path: 
            rtsp://frigate:{FRIGATE_RTSP_PASSWORD}@192.168.2.182:554/Streaming/Channels/302
          input_args:
            - -rtsp_transport
            - tcp
          roles: [detect, record]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
  cam_4:
    ffmpeg:
      output_args:
        record: preset-record-generic
      inputs:
        - path: 
            rtsp://frigate:{FRIGATE_RTSP_PASSWORD}@192.168.2.182:554/Streaming/Channels/402
          input_args:
            - -rtsp_transport
            - tcp
          roles: [detect, record]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
version: 0.18-0
lpr:
  enabled: true
  enhancement: 2
