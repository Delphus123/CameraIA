# Bridge Frigate -> Telegram (descrições GenAI do Moondream, em inglês).
# Token do bot NUNCA no repo: fica em /opt/frigate/ai-notify.env (chmod 600).
services:
  ai-notify:
    build: .
    image: cameraia/ai-notify:latest
    container_name: ai-notify
    restart: unless-stopped
    env_file: [/opt/frigate/ai-notify.env, /opt/frigate/.env]
    environment:
      - FRIGATE_API=http://frigate:5000
      - MQTT_HOST=mqtt
      - OLLAMA_URL=http://ollama-vlm:11434
      - GENAI_MODEL=moondream
      # Fase de monitoramento: só cam_1/cam_2 (decisão Rafael 04/11/26).
      # Car fora dos LABELS: carros parados geravam alerta sem valor; placa não é
      # legível na sub-stream 960x480 da cam_2 (~10px, precisa 60-100px p/ OCR).
      - CAMERAS=cam_1,cam_2
      - LABELS=person,motorcycle
      - COOLDOWN=300
    networks: [frigate_default]

  # EXPERIMENTO 24h (04-05/11/26): playback do HD do DVR (main 1920x1536) +
  # crop + OCR Moondream na cam_2/car. Sem Telegram, exceto placa válida
  # (tag [EXPERIMENTAL]). Resultados em /opt/frigate/lpr-exp/results.csv.
  lpr-exp:
    image: cameraia/ai-notify:latest
    container_name: lpr-exp
    restart: unless-stopped
    command: ["python3", "-u", "lpr_experiment.py"]
    env_file: [/opt/frigate/ai-notify.env, /opt/frigate/.env]
    environment:
      - FRIGATE_API=http://frigate:5000
      - MQTT_HOST=mqtt
      - OLLAMA_URL=http://ollama-vlm:11434
      - GENAI_MODEL=moondream
      - LPR_CAMERA=cam_2
      - LPR_LABELS=car
      - LPR_TRACK=201
      - LPR_RTSP_HOST=192.168.2.182
      - LPR_COOLDOWN=120
      - LPR_DATA_DIR=/data
    volumes:
      - /opt/frigate/lpr-exp:/data
    networks: [frigate_default]

networks:
  frigate_default:
    external: true
